<article class="chapter" [class.chapter--featured]="chapter().featured" [id]="chapter().id" reveal>
  <header class="head">
    <div class="head-copy">
      <p class="kicker">{{ chapter().flag }} {{ chapter().kicker }}</p>
      <h3>{{ chapter().title }}</h3>
      <p class="subtitle">{{ chapter().subtitle }}</p>
      <p class="story">{{ chapter().story }}</p>
    </div>

    <div class="chips" role="group" [attr.aria-label]="'Фильтр мест: ' + chapter().title">
      <button type="button" [class.on]="filter() === 'all'" (click)="filter.set('all')">Все</button>
      <button type="button" [class.on]="filter() === 'sight'" (click)="filter.set('sight')">Места</button>
      <button type="button" [class.on]="filter() === 'food'" (click)="filter.set('food')">Атмосфера</button>
    </div>
  </header>

  <div class="cards" [class.cards--four]="places().length === 4">
    @for (p of places(); track p.title) {
      <figure class="card">
        <div class="media">
          <img [src]="p.image" [alt]="p.title" loading="lazy" referrerpolicy="no-referrer" />
          <span class="kind">{{ p.kind === 'food' ? 'Атмосфера' : 'Локация' }}</span>
        </div>
        <figcaption>
          <span class="loc">{{ p.location }}</span>
          <strong>{{ p.title }}</strong>
          <p>{{ p.caption }}</p>
        </figcaption>
      </figure>
    }
  </div>
</article>
