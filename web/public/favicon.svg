<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#C8102E"/>
  <!-- Rounded A-peak frame -->
  <path d="M13 48L29.2 15.6C30.4 13.2 33.6 13.2 34.8 15.6L51 48" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Alpine ridge inside -->
  <path d="M18.5 46L26 34.5L31.5 41L38.5 32.5L45.5 46" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <!-- Winding road climbing to the peak -->
  <path d="M27.5 48C29.5 44 35.5 42.5 33.5 38.5C31.8 35.2 29.8 33.2 32 28.5" stroke="#F6DFB0" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Ascending plane at apex -->
  <path d="M32 18.5L35.4 25.4L32 24.1L28.6 25.4L32 18.5Z" fill="#FFFFFF"/>
</svg>
